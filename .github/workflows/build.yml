name: build

# Builds the WinForms app on a Windows runner. net9.0-windows / UseWindowsForms
# can only be built on Windows, so this validates every push and PR.
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build (Release)
        run: dotnet build -c Release --no-restore

      - name: Publish (self-contained, single file)
        run: >
          dotnet publish CopilotRemap.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o publish

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotRemap
          path: publish/

      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\CopilotRemap.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: CopilotRemap-Setup
          path: installer/CopilotRemap-Setup.exe
